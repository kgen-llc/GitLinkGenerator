name: Publish

env:
  CONFIGURATION: Release
  
on:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:

  compute_package_version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.compute-version.outputs.package_version }}
    steps:
    - id: compute-version
      name: Compute version
      run: |
        $(Invoke-WebRequest "https://www.nuget.org/api/v2/package/kgen.gitlinkgenerator/").BaseResponse.RequestMessage.RequestUri -match "kgen\.gitlinkgenerator\.1\.0\.([0-9]+).nupkg"
        $NewVersion = "1.0.$([int]$Matches.1 + 1)"
        if ($env:GITHUB_REF -ne 'refs/heads/dev') {
          $NewVersion = $NewVersion + '-build.${{ github.run_id }}'
        }
        Write-Host "New version: $NewVersion"
        "package_version=$NewVersion" >> $env:GITHUB_OUTPUT

  build:

    runs-on: ubuntu-latest

    needs: [ compute_package_version ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build 
      run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore ./GitLinkGenerator/GitLinkGenerator.csproj /p:Version=${{ needs.compute_package_version.outputs.package_version }}

    - name: Build package
      run: dotnet pack --configuration ${{ env.CONFIGURATION }} --no-restore ./GitLinkGenerator/GitLinkGenerator.csproj /p:Version=${{ needs.compute_package_version.outputs.package_version }} -o ./artifacts

    - name: NuGet login (OIDC → temp API key)
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: NuGet/login@v1
      id: login
      with:
        user: Fred.Forjan

    - name: NuGet push
      run:  |
        $files = Get-ChildItem ./artifacts -Recurse -Include *.nupkg
        foreach($file in $files) {
          Write-Host "Pushing NuGet package: $($file.FullName)"
          if ($env:GITHUB_REF -eq 'refs/heads/dev')
          {
             dotnet nuget push artifacts/my-sdk.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
          }        
        }